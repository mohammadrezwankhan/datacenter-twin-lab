name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Standard-library core, without optional dependencies
        run: python -m unittest discover -s tests -v
      - name: Install locked API and test dependencies
        run: |
          python -m pip install -r requirements-api.lock ".[api,test-api]"
          python -m pip check
          python scripts/check_dependency_versions.py api test-api
      - name: HTTP contracts and full regression suite
        run: python -m unittest discover -s tests -v
      - name: Optional numerical studies with pinned scientific runtime
        run: |
          python -m pip install -r requirements-studies.lock ".[studies]"
          python -m pip check
          python scripts/check_dependency_versions.py studies
          python -m unittest tests.test_research -v
      - name: Reproduce three evidence cases and validate their manifest
        run: |
          python scripts/build_evidence.py --output outputs/evidence --revision ${{ github.sha }}
          python scripts/build_evidence.py --verify outputs/evidence
      - name: Measure the reference cases in this environment
        shell: bash
        run: python scripts/benchmark_continuity.py --runs 10 --preset normal --preset generator_failure --preset path_maintenance --revision "${{ github.sha }}" > outputs/native-benchmark.json
      - name: Retain environment-specific reproducibility and timing evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: numerical-evidence-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            outputs/evidence
            outputs/native-benchmark.json
          retention-days: 90
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: apps/web
      - name: Type check and build the bundled dashboard
        run: |
          npm run format:check
          npm run build
        working-directory: apps/web
      - name: Offline demo export
        run: python -m datacenter_twin compare data/scenarios/baseline-1mw.json data/scenarios/alternative-pue-115.json --output outputs/comparison.json
      - name: Build wheel with pinned backend
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify installed wheel outside the checkout
        run: python scripts/verify_distribution.py dist --require-web
      - name: Install browser for end-to-end verification
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Browser journeys at desktop, tablet and phone widths
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: npm run test:e2e
        working-directory: apps/web
      - name: Retain browser proof
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: browser-evidence
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 14

  browser-demo:
    name: Browser demo and Python parity
    needs: verify
    runs-on: ubuntu-latest
    # Both browser suites can take 14 minutes; allow setup and artifact cleanup.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci --ignore-scripts
      - name: Prepare pinned numerical study runtimes
        run: |
          python -m pip install -r requirements-studies.lock ".[studies]"
          python -m pip check
          python scripts/check_dependency_versions.py studies
          python scripts/fetch_study_runtime.py
      - run: python scripts/prepare_browser_demo.py
      - name: Infrastructure screens and independent Python equations
        run: python scripts/verify_infrastructure.py
      - run: npm --prefix apps/web run test:engine
      - name: Build browser demo with the appropriate source provenance
        run: |
          if [ "$GITHUB_REPOSITORY" = "mohammadrezwankhan/datacenter-twin-lab" ]; then
            export VITE_PUBLIC_SOURCE_REVISION="$GITHUB_SHA"
          else
            unset VITE_PUBLIC_SOURCE_REVISION
          fi
          npm --prefix apps/web run build:demo
      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Prepare legacy GitHub Pages forwarding
        run: python scripts/build_pages_redirect.py --site .local/browser-demo-site --output .local/github-pages-redirect
      - name: Overlay the reviewed learning lab onto the legacy Pages artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from shutil import copytree
          source = Path('docs')
          output = Path('.local/github-pages-redirect')
          expected = 'mohammadrezwankhan/datacenter-twin-lab'
          config = json.loads((source / 'lesson-config.json').read_text(encoding='utf-8'))
          page = (source / 'index.html').read_text(encoding='utf-8')
          assert 'data-flagship-repo="' + expected + '"' in page
          assert config['repository']['owner'] + '/' + config['repository']['slug'] == expected
          copytree(source, output, dirs_exist_ok=True)
          published = (output / 'index.html').read_text(encoding='utf-8')
          assert 'data-flagship-repo="' + expected + '"' in published
          print('Reviewed lesson dashboard composed into legacy Pages tree; original redirect/media files remain.')
          PY
      - run: npm --prefix apps/web run test:demo
      - name: Verify the same artifact at a custom-domain root
        run: npm --prefix apps/web run test:demo -- --grep "all presets match native Python|evidence hub exposes|five-minute guide requires|search pages|EMT study|power dynamics|infrastructure"
        env:
          TWIN_DEMO_BASE: /
      - name: Retain browser and engine evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-python-evidence
          path: |
            apps/web/test-results
            apps/web/playwright-report-demo
            apps/web/test-results-root
            apps/web/playwright-report-root
            .local/browser-demo-site/engine-manifest.json
          include-hidden-files: true
          retention-days: 14
      - name: Upload tested static demo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'mohammadrezwankhan/datacenter-twin-lab'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-browser-bundle
          path: .local/browser-demo-site
          include-hidden-files: true
          retention-days: 90
      - name: Upload legacy GitHub Pages forwarding
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'mohammadrezwankhan/datacenter-twin-lab'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .local/github-pages-redirect

  deploy-demo:
    name: Publish static demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'mohammadrezwankhan/datacenter-twin-lab'
    needs: browser-demo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
