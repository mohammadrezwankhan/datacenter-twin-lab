name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Standard-library core, without optional dependencies
        run: python -m unittest discover -s tests -v
      - name: Install locked API and test dependencies
        run: python -m pip install -r requirements-api.lock
      - name: HTTP contracts and full regression suite
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: apps/web
      - name: Type check and build the bundled dashboard
        run: |
          npm run format:check
          npm run build
        working-directory: apps/web
      - name: Offline demo export
        run: python -m datacenter_twin compare data/scenarios/baseline-1mw.json data/scenarios/alternative-pue-115.json --output outputs/comparison.json
      - name: Build wheel with pinned backend
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify installed wheel outside the checkout
        run: python scripts/verify_distribution.py dist --require-web
      - name: Install browser for end-to-end verification
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Browser journeys at desktop, tablet and phone widths
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: npm run test:e2e
        working-directory: apps/web
      - name: Retain browser proof
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: browser-evidence
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 14
